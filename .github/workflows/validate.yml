name: validate

# ตรวจ manifest และ test ของตัวกันคำสั่งทุก PR / push ขึ้น main
# ตัวกันอยู่บน API ของ mod ที่ยังใหม่ — ถ้า Claude Code เปลี่ยน API จนตัวกันหยุดทำงาน test ควรแดงที่นี่ก่อนถึงเครื่องทีม
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0   # ขั้นต่ำที่ README บอก (รุ่นแรกที่รัน .ts ได้เองโดยไม่ใส่ flag) — ทดสอบที่ขั้นต่ำ
      # pin เวอร์ชันที่ test ผ่านในเครื่อง dev; ขยับเมื่อทดสอบเวอร์ชันใหม่แล้ว
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate . --strict
      - run: claude plugin test .
      # PreToolUse hook รันด้วย node จริง (ไม่ใช่ runtime ของ claude plugin test) — ตรวจว่า node รุ่นขั้นต่ำรัน .ts ได้และตอบ ask
      - name: PreToolUse hook answers ask under node
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"ros2 topic pub /test std_msgs/msg/String {}"}}' \
            | node hooks/pretooluse.ts | grep -q '"permissionDecision":"ask"'
          out=$(echo '{"tool_name":"Bash","tool_input":{"command":"ros2 topic list"}}' | node hooks/pretooluse.ts)
          test -z "$out"
          echo 'not json' | node hooks/pretooluse.ts | grep -q '"permissionDecision":"ask"'
      # ตัวตรวจ flowchart: ตัวอย่างต้องผ่าน และไฟล์ที่ทางแยกไม่มีป้ายต้องไม่ผ่าน
      - name: flowchart checker
        run: |
          for f in skills/flowchart/examples/*.drawio; do node skills/flowchart/tools/check_drawio.mjs "$f"; done
          ex=skills/flowchart/examples/clamp-press-cycle.drawio
          sed 's/id="e_dclamp_yes" value="ใช่"/id="e_dclamp_yes" value=""/' "$ex" > "$RUNNER_TEMP/bad.drawio"
          ! node skills/flowchart/tools/check_drawio.mjs "$RUNNER_TEMP/bad.drawio"
      # ตัวตรวจ CLAUDE.md: ตัวอย่างต้องผ่าน และสำเนาที่ key ถูกเปลี่ยนชื่อต้องไม่ผ่าน
      - name: CLAUDE.md checker
        run: |
          ex=skills/project-claude-md/examples/conveyor-sorter
          node skills/project-claude-md/tools/check_claude_md.mjs "$ex/CLAUDE.example.md"
          cp -r "$ex" "$RUNNER_TEMP/stale"
          sed -i "s/PLC_TIMEOUT_MS/PLC_RESPONSE_TIMEOUT/" "$RUNNER_TEMP/stale/api/.env.example"
          ! node skills/project-claude-md/tools/check_claude_md.mjs "$RUNNER_TEMP/stale/CLAUDE.example.md"

  # โค้ด template ที่คุม hardware ใน skill (ramp, watchdog, Modbus client) — Ubuntu 22.04 = รุ่นเดียวกับเครื่อง runtime
  templates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ libgtest-dev libmodbus-dev
      - run: bash tools/test-templates.sh
